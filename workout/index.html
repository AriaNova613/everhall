<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<!-- ---------------------------------------------------------------------------
     Content-Security-Policy.

     GitHub Pages cannot set response headers, so this meta tag is the only
     place a policy can live. It has to come before anything it governs, which
     is why it sits this high.

     Everything the page needs is served from this origin: the fonts are
     self-hosted, the Supabase client is vendored, and there is not one inline
     script or style attribute in the whole app. That is what allows
     `script-src 'self'` with no hash exception — and a hash would have been a
     trap, because it changes if git so much as rewrites the line endings on
     the way to the deploy repository, and the failure would appear only in
     production.

     Two directives are absent on purpose: `frame-ancestors` and `report-uri`
     are both ignored inside a meta tag, so writing them would only look like
     protection.
     --------------------------------------------------------------------------- -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://twfwkcmwvwdnbavrsang.supabase.co wss://twfwkcmwvwdnbavrsang.supabase.co; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests">

<title>Carr Athletics</title>
<meta name="description" content="One check a day. The family workout board.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<!-- One theme-color tag, mutated in place if it ever needs to change. The old
     pair of prefers-color-scheme tags was pointless: this app has one theme. -->
<meta name="theme-color" content="#0B0A09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carr">
<!-- black-translucent is a package deal with viewport-fit=cover: it makes the
     safe-area insets non-zero, and every sticky or bottom-anchored thing in the
     stylesheet pads for them. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<!-- iOS reads this in preference to anything in the manifest. 180 square,
     opaque, unrounded — iOS applies its own mask. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">

<link rel="stylesheet" href="app.css">
<script src="boot.js"></script>
</head>
<body>

<!-- One sprite of 24x24 line icons. Every one is fill:none/stroke:currentColor,
     so an icon takes the colour of whatever it sits in. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <g id="g-stroke" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-flat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-install" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-ios-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8.5 6.5 12 3l3.5 3.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></symbol>
  <symbol id="i-ios-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/></symbol>
  <symbol id="i-offline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M8.6 15.6a4.8 4.8 0 0 1 6.8 0"/><path d="M5.4 12.4a9.3 9.3 0 0 1 4-2.4M18.6 12.4a9.3 9.3 0 0 0-3.1-2.2"/><path d="M2.2 9.2A14 14 0 0 1 7 6.3M21.8 9.2a14 14 0 0 0-8.7-3.2"/><path d="M12 19v.1"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8.5 10.5 12 8l3.5 2.5"/><path d="M7 15h10"/></symbol>
</svg>

<a class="skip" href="#main">Skip to the board</a>

<!-- Boot: replaced by boot.js with a real message if start-up fails. -->
<div id="boot"><span class="spin" role="status" aria-label="Loading"></span></div>

<!-- Gate: sign in, setup, or no access. -->
<div id="gate" class="gatewrap" hidden>
  <div class="gate">
    <div class="gate__mark">
      <div class="gate__c">CARR</div>
      <div class="gate__r"></div>
      <div class="gate__a">Athletics</div>
    </div>
    <div id="gateBody"></div>
  </div>
</div>

<!-- The app. -->
<div id="app" hidden>
  <header class="bar">
    <div class="bar__in">
      <h1 class="mark">
        <span class="mark__c">Carr</span>
        <span class="mark__bar" aria-hidden="true"></span>
        <span class="mark__a">Athletics</span>
      </h1>
      <span class="grow"></span>
      <div class="live" id="live" data-state="off">
        <span class="live__dot" aria-hidden="true"></span>
        <span class="live__t" id="liveText">Offline</span>
      </div>
      <button class="ibtn" id="settingsBtn" type="button" aria-label="Settings">
        <svg aria-hidden="true" focusable="false"><use href="#i-gear"/></svg>
      </button>
    </div>
  </header>

  <main class="page" id="main">
    <div id="bannerRoot"></div>

    <section class="sec sec--today" aria-labelledby="hdToday">
      <div class="sec__hd"><h2 class="cap" id="hdToday">Today</h2></div>
      <div class="panel today" id="todayCard"></div>
    </section>

    <section class="sec sec--family" aria-labelledby="hdFamily">
      <div class="sec__hd">
        <h2 class="cap" id="hdFamily">The family &middot; today</h2>
        <span class="cap" id="familyCount"></span>
      </div>
      <div class="panel roster" id="familyCard"></div>
    </section>

    <section class="sec sec--week" aria-labelledby="hdWeek">
      <div class="sec__hd">
        <h2 class="cap" id="hdWeek">This week</h2>
        <span class="cap" id="weekRange"></span>
      </div>
      <div class="panel week" id="weekCard"></div>
    </section>

    <section class="sec sec--month" aria-labelledby="hdMonth">
      <h2 class="sr" id="hdMonth">Every month, person by person</h2>
      <div class="monthbar">
        <button class="navb" id="prevM" type="button" aria-label="Previous month">
          <svg aria-hidden="true" focusable="false"><use href="#i-left"/></svg>
        </button>
        <div class="monthbar__l" id="monthLabel"></div>
        <button class="navb" id="nextM" type="button" aria-label="Next month">
          <svg aria-hidden="true" focusable="false"><use href="#i-right"/></svg>
        </button>
      </div>
      <div class="rail" id="rail">
        <div class="rail__in" id="railIn" role="tablist" aria-label="Whose board to show"></div>
        <span class="rail__ink" id="railInk" aria-hidden="true"></span>
      </div>
      <div class="plates" id="plates"></div>
      <div class="index" id="indexList"></div>
    </section>

    <section class="sec sec--weight" aria-labelledby="hdWeight">
      <div class="sec__hd"><h2 class="cap" id="hdWeight">Weight</h2></div>
      <div class="panel weight" id="weightCard"></div>
    </section>

    <section class="sec sec--install" id="installSec" hidden aria-labelledby="hdInstall">
      <h2 class="sr" id="hdInstall">Add this to your home screen</h2>
      <div class="install" id="installCard"></div>
    </section>
  </main>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="alertRoot" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
